<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DASH.js Player Metrics</title>
    <script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>
    <style>
        /* Global styles */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        h1 {
            margin-top: 20px;
            font-size: 2em;
            color: #ff3b3f;
        }

        /* Video player */
        video {
            width: 90%;
            max-width: 900px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }

        /* Metrics panel */
        .metrics {
            background-color: #1e1e1e;
            padding: 20px 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 900px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
        }

        .metric {
            margin: 10px;
            text-align: center;
        }

        .metric span {
            display: block;
            font-size: 1.2em;
            margin-top: 5px;
            color: #00ffcc;
        }

        /* Footer */
        .footer {
            margin-top: auto;
            padding: 20px;
            color: #888;
            font-size: 0.9em;
        }

        /* Responsive adjustments */
        @media (max-width: 600px) {
            .metrics {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>
    <h1>DASH.js Video Player</h1>
    <video id="videoPlayer" controls autoplay></video>

    <div class="metrics">
        <div class="metric">
            <strong>Buffer Length</strong>
            <span id="bufferLength">0 s</span>
        </div>
        <div class="metric">
            <strong>Average Throughput</strong>
            <span id="averageThroughput">0 kbps</span>
        </div>
        <div class="metric">
            <strong>Playhead Time</strong>
            <span id="playheadTime">0 s</span>
        </div>
        <div class="metric">
            <strong>Resolution</strong>
            <span id="resolution">0 x 0</span>
        </div>
    </div>

    <div class="footer">
        Made with sweat and tears using DASH.js for streaming
    </div>

    <script>
        // Local video manifest path
        // const url = "dash_godfather_test/godfather_test.mpd";
        const url = "dash_godfather_train/godfather_train.mpd";
        // const url = "dash_avatar_test/avatar_test.mpd";
        // const url = "dash_avatar_train/avatar_train.mpd";


        const player = dashjs.MediaPlayer().create();
        player.initialize(document.getElementById("videoPlayer"), url, true);

        function updateMetrics() {
            const video = document.getElementById("videoPlayer");

            // Buffer length (in seconds)
            const bufferLength = video.buffered.length > 0
                ? video.buffered.end(video.buffered.length - 1) - video.currentTime
                : 0;

            // Playhead time
            const playheadTime = video.currentTime;

            // Approximate throughput
            const avgThroughput = player.getAverageThroughput("video") / 1000 || 0; // kbps

            // Resolution from current video element
            const resolution = `${video.videoWidth} x ${video.videoHeight}`;

            document.getElementById("bufferLength").innerText = bufferLength.toFixed(2) + " s";
            document.getElementById("averageThroughput").innerText = avgThroughput.toFixed(2) + " kbps";
            document.getElementById("playheadTime").innerText = playheadTime.toFixed(2) + " s";
            document.getElementById("resolution").innerText = resolution;
        }

        setInterval(updateMetrics, 1000);
    </script>
</body>
</html>
